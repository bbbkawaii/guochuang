name: Diagnose materialization assembly

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'release/rebuild-clean-payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inspect exact assembly
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/rebuild-clean-payload
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib, subprocess
          w=Path('.github/workflows/materialize-from-payload.yml').read_text()
          m=re.search(r"printf '%s' '([A-Za-z0-9+/=]+)' >> \.rebuild/piece-020\.b64", w)
          assert m
          suffix=m.group(1)
          prefix=subprocess.check_output(['git','show','origin/release/rebuild-clean-payload:.rebuild/piece-020.b64'], text=True)
          p17=subprocess.check_output(['git','show','origin/release/rebuild-clean-payload:.rebuild/piece-017.b64'])[:10000]
          p9=subprocess.check_output(['git','show','origin/release/rebuild-clean-payload:.rebuild/piece-009.b64'])
          combined=(prefix+suffix).encode()
          print('PREFIX_LEN',len(prefix),'PREFIX_SHA256',hashlib.sha256(prefix.encode()).hexdigest())
          print('SUFFIX_LEN',len(suffix),'SUFFIX_SHA256',hashlib.sha256(suffix.encode()).hexdigest())
          print('COMBINED_LEN',len(combined),'COMBINED_SHA256',hashlib.sha256(combined).hexdigest())
          print('P17_LEN',len(p17),'P17_SHA256',hashlib.sha256(p17).hexdigest())
          print('P009_LEN',len(p9),'P009_SHA256',hashlib.sha256(p9).hexdigest())
          PY
