name: Diagnose materialization assembly

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'release/rebuild-clean-payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Hash suffix 100-char blocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          w=Path('.github/workflows/materialize-from-payload.yml').read_text()
          m=re.search(r"printf '%s' '([A-Za-z0-9+/=]+)' >> \.rebuild/piece-020\.b64", w)
          assert m
          s=m.group(1)
          for off in range(2500,len(s),100):
              part=s[off:off+100].encode()
              print(off,len(part),hashlib.sha256(part).hexdigest())
          PY
