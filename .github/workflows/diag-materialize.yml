name: Diagnose materialization assembly

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'release/rebuild-clean-payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Print repaired suffix comparison window
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          w=Path('.github/workflows/materialize-from-payload.yml').read_text()
          m=re.search(r"printf '%s' '([A-Za-z0-9+/=]+)' >> \.rebuild/piece-020\.b64",w)
          assert m
          s=m.group(1)
          s=s[:2361]+'YWdlcy9w'+s[2361:]
          s=s[:2406]+'A'+s[2406:]
          print('WINDOW='+s[2250:2550])
          PY
