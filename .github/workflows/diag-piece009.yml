name: Diagnose payload piece 009

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'release/rebuild-clean-payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Print piece 009 corrupt window
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/rebuild-clean-payload
          git show origin/release/rebuild-clean-payload:.rebuild/piece-009.b64 > /tmp/p9
          printf 'WINDOW='
          dd if=/tmp/p9 bs=1 skip=8460 count=10 status=none
          printf '\n'
