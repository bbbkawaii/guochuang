name: Repair payload piece 009

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'release/rebuild-clean-payload'
    runs-on: ubuntu-latest
    steps:
      - name: Check out payload branch
        uses: actions/checkout@v4
        with:
          ref: release/rebuild-clean-payload
          fetch-depth: 0
      - name: Repair the single corrupt base64 character
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('.rebuild/piece-009.b64'); s=p.read_text(); assert len(s)==10000; assert s[8461] in ('h','g'); p.write_text(s if s[8461]=='g' else s[:8461]+'g'+s[8462:])"
          test "$(sha256sum .rebuild/piece-009.b64 | awk '{print $1}')" = "5a278c5f2a8091b5f47c7238ce3ba20b97c82fdc10151d806383c3ac4f4dcaaf"
          if git diff --quiet -- .rebuild/piece-009.b64; then
            echo 'piece-009 already repaired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .rebuild/piece-009.b64
          git commit -m 'fix: repair final payload chunk'
          git push origin HEAD:release/rebuild-clean-payload
