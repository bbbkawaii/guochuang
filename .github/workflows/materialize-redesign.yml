name: Materialize redesign

on:
  push:
    branches:
      - release/rebuild-clean-payload
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out upload branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild final project
        shell: bash
        run: |
          set -euo pipefail
          cat .rebuild/piece-*.b64 | base64 -d > /tmp/guochuang-project.zip

          rm -rf web miniprogram
          rm -f README.md LICENSE .gitignore netlify.toml
          unzip -q /tmp/guochuang-project.zip -d .

          mkdir -p miniprogram/assets/images
          cp -a web/assets/images/. miniprogram/assets/images/

          test -s web/index.html
          test -s web/styles.css
          test -s web/app.js
          test -s miniprogram/app.json
          test -s miniprogram/pages/home/home.wxml
          test -s web/assets/images/hero.webp
          test -s web/assets/images/workshop.webp
          test -s web/assets/images/tomato.webp
          test -s web/assets/images/icecream.webp
          test -s web/assets/images/village.webp

          if find web miniprogram -type f -name '*.svg' -print -quit | grep -q .; then
            echo 'SVG file found; refusing to publish.' >&2
            exit 1
          fi

          if grep -R -n -E '培训材料汇总|不直接等同于|测算情境|待补充实测|仅供参考|数据口径' web miniprogram; then
            echo 'Internal explanatory copy found; refusing to publish.' >&2
            exit 1
          fi

          rm -rf .rebuild
          rm -f .github/workflows/materialize-redesign.yml

      - name: Commit clean redesign
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish redesigned competition website and mini program'
          git push origin HEAD:${GITHUB_REF_NAME}
