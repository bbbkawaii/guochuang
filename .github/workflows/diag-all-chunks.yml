name: Diagnose all payload chunks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'release/rebuild-clean-payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Hash all chunks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/rebuild-clean-payload
          rm -rf /tmp/rebuild
          mkdir -p /tmp/rebuild
          git archive origin/release/rebuild-clean-payload .rebuild | tar -x -C /tmp/rebuild
          for f in /tmp/rebuild/.rebuild/piece-*.b64; do
            printf '%s ' "$(basename "$f")"
            wc -c < "$f" | tr -d '\n'
            printf ' '
            sha256sum "$f" | awk '{print $1}'
          done
