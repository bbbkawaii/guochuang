name: Bootstrap project files

on:
  push:
    paths:
      - core.tar.xz.b64

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and unpack project
        run: |
          base64 -d core.tar.xz.b64 > core.tar.xz
          tar -xJf core.tar.xz
          python3 scripts/generate_vector_assets.py
          rm -f core.tar.xz core.tar.xz.b64 .github/workflows/bootstrap.yml
      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .gitignore netlify.toml miniprogram web scripts .github/workflows/validate.yml
          git add -u -- core.tar.xz.b64 .github/workflows/bootstrap.yml
          git commit -m "feat: add competition website and native mini program"
          git push
