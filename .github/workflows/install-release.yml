name: Install polished raster release

on:
  push:
    branches:
      - codex/finish-raster-site
    paths:
      - .payload-v2/READY

permissions:
  contents: write

concurrency:
  group: install-polished-raster-release
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: codex/finish-raster-site
          fetch-depth: 0

      - name: Reconstruct and verify package
        shell: bash
        run: |
          set -euo pipefail
          cat .payload-v2/part-* > /tmp/release.b64
          base64 --decode /tmp/release.b64 > /tmp/release.tar.xz
          echo "4b9ff6ecfd5dc7b724d98f343793815f88eafc0943d2e83e9e90c0683e5b146c  /tmp/release.tar.xz" | sha256sum --check --strict

      - name: Replace project files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf web miniprogram scripts docs
          rm -f README.md ASSET-NOTICE.md LICENSE netlify.toml .gitignore
          tar -xJf /tmp/release.tar.xz -C .
          rm -rf .payload-v2 .github/workflows/install-release.yml

      - name: Validate public project
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_project.py
          node --check web/app.js
          find miniprogram -name '*.js' -print0 | xargs -0 -n1 node --check
          ! find web miniprogram -type f -iname '*.svg' | grep .
          ! grep -RniE '培训材料汇总|以下数字用于|不直接等同|成品采购亩次|自制发酵亩次|均来自培训材料|待补充实测|概念设计|测算情境|lorem ipsum' web miniprogram

      - name: Commit installed release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: finish polished raster website and native mini program"
          git push origin HEAD:codex/finish-raster-site
