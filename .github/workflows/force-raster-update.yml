name: Force raster visual update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/force-raster-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download complete revised project
        run: |
          curl --fail --location --retry 12 --retry-delay 5 \
            https://ruitu-guochuang-update.serveo.net/guochuang-update.tar.xz \
            --output /tmp/project-update.tar.xz
          test -s /tmp/project-update.tar.xz
          xz -t /tmp/project-update.tar.xz
      - name: Replace project files
        run: |
          rm -rf web miniprogram docs scripts
          rm -f README.md ASSET-NOTICE.md LICENSE netlify.toml .gitignore
          tar -xJf /tmp/project-update.tar.xz -C .
          rm -f web/project-update.tar.xz
          find . -type f -name '*.svg' -delete
          rm -f scripts/generate_vector_assets.py
      - name: Validate complete project
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/validate_project.py
          node --check web/app.js
          for file in miniprogram/app.js miniprogram/pages/*/*.js; do node --check "$file"; done
      - name: Commit and clean temporary workflows
        run: |
          rm -f .github/workflows/force-raster-update.yml
          rm -f .github/workflows/ensure-raster-update.yml
          rm -f .github/workflows/apply-raster-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md ASSET-NOTICE.md LICENSE .gitignore netlify.toml web miniprogram docs scripts .github/workflows/validate.yml
          git add -u -- .github/workflows/force-raster-update.yml .github/workflows/ensure-raster-update.yml .github/workflows/apply-raster-update.yml
          git commit -m "feat: publish raster visuals and final copy audit"
          git push
