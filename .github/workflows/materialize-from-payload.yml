name: Materialize final redesign

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'release/rebuild-clean-payload'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore and validate final redesign
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/rebuild-clean-payload
          rm -rf .rebuild
          git checkout origin/release/rebuild-clean-payload -- .rebuild

          head -c 10000 .rebuild/piece-017.b64 > /tmp/p17
          mv /tmp/p17 .rebuild/piece-017.b64

          test "$(wc -c < .rebuild/piece-009.b64)" -eq 10000
          test "$(wc -c < .rebuild/piece-017.b64)" -eq 10000
          test "$(wc -c < .rebuild/piece-020.b64)" -eq 10000
          test "$(sha256sum .rebuild/piece-009.b64 | awk '{print $1}')" = "5a278c5f2a8091b5f47c7238ce3ba20b97c82fdc10151d806383c3ac4f4dcaaf"
          test "$(sha256sum .rebuild/piece-017.b64 | awk '{print $1}')" = "e1f1aaa6cda5691cae9f03ec011485d7b01717dd1ab0b71e51b3bbdd0b73984d"
          test "$(sha256sum .rebuild/piece-020.b64 | awk '{print $1}')" = "c58a955e57498433b38f813a77fe3525fb7315338471f6d251de5523368f4bc3"

          cat .rebuild/piece-*.b64 | base64 -d > /tmp/guochuang-project.zip
          test "$(sha256sum /tmp/guochuang-project.zip | awk '{print $1}')" = "7b272e127cc78844af6b724493da216dd76d611434bc0abb17404699c344c482"
          unzip -tq /tmp/guochuang-project.zip

          rm -rf web miniprogram
          rm -f README.md LICENSE .gitignore netlify.toml
          unzip -q /tmp/guochuang-project.zip -d .
          mkdir -p miniprogram/assets/images
          cp -a web/assets/images/. miniprogram/assets/images/

          test -s web/index.html
          test -s web/styles.css
          test -s web/app.js
          test -s miniprogram/app.json
          test -s miniprogram/pages/home/home.wxml
          for image in hero workshop tomato icecream village; do
            test -s "web/assets/images/${image}.webp"
            test -s "miniprogram/assets/images/${image}.webp"
          done
          test -s web/assets/images/logo.jpg
          test -s miniprogram/assets/images/logo.jpg

          if find web miniprogram -type f -name '*.svg' -print -quit | grep -q .; then
            echo 'SVG file found; refusing to publish.' >&2
            exit 1
          fi
          if grep -R -n -E '培训材料汇总|不直接等同于|测算情境|待补充实测|仅供参考|数据口径' web miniprogram; then
            echo 'Internal explanatory copy found; refusing to publish.' >&2
            exit 1
          fi

          rm -rf .rebuild .github

      - name: Commit clean redesign to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish redesigned competition website and mini program'
          git push origin HEAD:main
