name: Materialize final redesign

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'release/rebuild-clean-payload'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore redesign from payload branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/rebuild-clean-payload
          rm -rf .rebuild
          git checkout origin/release/rebuild-clean-payload -- .rebuild
          rm -f .rebuild/trigger.txt

          shopt -s nullglob
          pieces=(.rebuild/piece-*.b64)
          test ${#pieces[@]} -gt 0
          : > /tmp/guochuang-project.b64
          for f in "${pieces[@]}"; do
            tr -cd 'A-Za-z0-9+/=' < "$f" >> /tmp/guochuang-project.b64
          done
          base64 -d /tmp/guochuang-project.b64 > /tmp/guochuang-project.zip
          unzip -tq /tmp/guochuang-project.zip

          rm -rf web miniprogram
          rm -f README.md LICENSE .gitignore netlify.toml
          unzip -q /tmp/guochuang-project.zip -d .

          mkdir -p miniprogram/assets/images
          cp -a web/assets/images/. miniprogram/assets/images/

          test -s web/index.html
          test -s web/styles.css
          test -s web/app.js
          test -s miniprogram/app.json
          test -s miniprogram/pages/home/home.wxml
          test -s web/assets/images/hero.webp
          test -s web/assets/images/workshop.webp
          test -s web/assets/images/tomato.webp
          test -s web/assets/images/icecream.webp
          test -s web/assets/images/village.webp

          if find web miniprogram -type f -name '*.svg' -print -quit | grep -q .; then
            echo 'SVG file found; refusing to publish.' >&2
            exit 1
          fi

          if grep -R -n -E '培训材料汇总|不直接等同于|测算情境|待补充实测|仅供参考|数据口径' web miniprogram; then
            echo 'Internal explanatory copy found; refusing to publish.' >&2
            exit 1
          fi

          rm -rf .rebuild
          rm -f .github/workflows/materialize-from-payload.yml

      - name: Commit final redesign to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish redesigned competition website and mini program'
          git push origin HEAD:main
